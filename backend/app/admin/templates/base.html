<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}لوحة إدارة نوا{% endblock %}</title>
  <style>
    :root {
      --paper: #FBF7F2;
      --ivory: #F3EDE4;
      --sand:  #E7DCCC;
      --line:  #DED3C5;
      --ink:   #1C1612;
      --muted: #6B5D52;
      --brand:      #2C3A2E;
      --brand-deep: #1F2A21;
      --brass:      #B5894C;
      --brass-soft: #D4B384;
      --success: #2C5F3F;
      --danger:  #8B2E2E;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Segoe UI", "IBM Plex Sans Arabic", "Noto Sans Arabic", sans-serif;
      background: var(--paper);
      color: var(--ink);
      font-size: 14px;
      line-height: 1.5;
    }
    a { color: var(--brand); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .wrap { max-width: 1240px; margin: 0 auto; padding: 24px; }

    /* Header */
    .nav {
      background: var(--brand-deep);
      color: var(--ivory);
      border-bottom: 2px solid var(--brass);
    }
    .nav-inner {
      max-width: 1240px; margin: 0 auto; padding: 14px 24px;
      display: flex; align-items: center; gap: 24px;
    }
    .nav .brand {
      font-weight: 700; font-size: 16px;
      display: flex; align-items: center; gap: 10px;
    }
    .nav .brand .dot {
      width: 28px; height: 28px; border-radius: 50%;
      background: var(--ivory); color: var(--brand-deep);
      display: inline-flex; align-items: center; justify-content: center;
      font-weight: 700;
    }
    .nav .brand small {
      font-weight: 400; color: var(--brass-soft);
      font-size: 11px; letter-spacing: 1px; text-transform: uppercase;
    }
    .nav .links { display: flex; gap: 18px; margin-right: auto; }
    .nav .links a {
      color: var(--ivory); opacity: 0.75;
      padding: 6px 2px; border-bottom: 2px solid transparent;
    }
    .nav .links a:hover,
    .nav .links a.active { opacity: 1; border-color: var(--brass); text-decoration: none; }
    .nav .user { color: var(--brass-soft); font-size: 12px; }

    /* Cards */
    .card {
      background: #fff; border: 1px solid var(--line);
      border-radius: 12px; padding: 18px;
    }
    .card h3 {
      margin: 0 0 14px; font-size: 13px;
      color: var(--muted); text-transform: uppercase; letter-spacing: 1px;
      font-weight: 600;
    }

    .grid { display: grid; gap: 16px; }
    .grid.cols-4 { grid-template-columns: repeat(4, 1fr); }
    .grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
    .grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
    @media (max-width: 900px) {
      .grid.cols-4, .grid.cols-3 { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 640px) {
      .nav-inner { flex-wrap: wrap; gap: 10px; padding: 12px 16px; }
      .nav .links { width: 100%; margin-right: 0; }
      .grid.cols-4, .grid.cols-3, .grid.cols-2 { grid-template-columns: 1fr; }
      .wrap { padding: 16px; }
      table { display: block; overflow-x: auto; }
    }

    /* Stat */
    .stat .v { font-size: 28px; font-weight: 700; color: var(--ink); font-feature-settings: "tnum"; }
    .stat .l { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .stat .delta { font-size: 11px; margin-top: 6px; color: var(--brass); }

    /* Table */
    table { width: 100%; border-collapse: collapse; }
    th, td {
      padding: 10px 12px; text-align: right;
      border-bottom: 1px solid var(--line); font-size: 13px;
    }
    th {
      font-size: 11px; text-transform: uppercase; color: var(--muted);
      font-weight: 600; letter-spacing: 0.5px; background: var(--ivory);
    }
    tr:hover td { background: var(--ivory); }
    td.num { font-feature-settings: "tnum"; }
    td.ltr { direction: ltr; text-align: left; font-family: ui-monospace, monospace; font-size: 12px; }

    /* Pills */
    .pill {
      display: inline-block; padding: 2px 10px;
      border-radius: 999px; font-size: 11px; font-weight: 600;
      background: var(--ivory); color: var(--muted); border: 1px solid var(--line);
    }
    .pill.ok    { background: #E8F0E8; color: var(--success); border-color: #CFE2CF; }
    .pill.warn  { background: #FBF2E0; color: var(--brass); border-color: var(--brass-soft); }
    .pill.err   { background: #FBE8E8; color: var(--danger); border-color: #E8CFCF; }
    .pill.brand { background: var(--brand); color: var(--ivory); border-color: var(--brand); }

    /* Forms */
    form.filters {
      display: flex; flex-wrap: wrap; gap: 10px; align-items: end;
      margin-bottom: 20px;
    }
    .field label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
    .field input, .field select {
      padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px;
      background: #fff; color: var(--ink); font-size: 13px; min-width: 140px;
      font-family: inherit;
    }
    .field input:focus, .field select:focus { outline: 2px solid var(--brand); border-color: var(--brand); }
    .btn {
      padding: 8px 18px; border: 1px solid var(--brand); border-radius: 999px;
      background: var(--brand); color: var(--ivory); font-size: 13px; font-weight: 600;
      cursor: pointer; font-family: inherit;
    }
    .btn:hover { background: var(--brand-deep); border-color: var(--brand-deep); }
    .btn.ghost { background: #fff; color: var(--brand); }

    .checkbox { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }

    /* Chart */
    .chart { height: 180px; display: flex; align-items: end; gap: 4px; padding: 10px 0 0; }
    .chart .bar {
      flex: 1; min-width: 6px; background: var(--brand-deep);
      border-radius: 3px 3px 0 0; position: relative;
      transition: background 0.15s;
    }
    .chart .bar:hover { background: var(--brass); }
    .chart .bar::after {
      content: attr(data-tip); position: absolute;
      bottom: 100%; right: 50%; transform: translateX(50%);
      background: var(--brand-deep); color: var(--ivory);
      font-size: 11px; padding: 4px 8px; border-radius: 4px;
      white-space: nowrap; opacity: 0; pointer-events: none;
      margin-bottom: 6px;
    }
    .chart .bar:hover::after { opacity: 1; }

    /* Config banner */
    .alert {
      padding: 12px 16px; border-radius: 8px; margin-bottom: 20px;
      font-size: 13px; border: 1px solid;
    }
    .alert.warn { background: #FBF2E0; color: #8A6124; border-color: var(--brass-soft); }

    .mt { margin-top: 20px; }
    .section-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
    .section-head h2 { margin: 0; font-size: 18px; color: var(--ink); }
    .section-head .meta { font-size: 12px; color: var(--muted); }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <div class="brand">
        <span class="dot">N</span>
        <span>
          لوحة إدارة نوا
          <small style="display:block;">Nawa House · Admin</small>
        </span>
      </div>
      <div class="links">
        <a href="/admin/" class="{% if request.url.path == '/admin/' or request.url.path == '/admin' %}active{% endif %}">نظرة عامة</a>
        <a href="/admin/orders" class="{% if '/admin/orders' in request.url.path %}active{% endif %}">الطلبات</a>
      </div>
      <div class="user">
        {{ admin_user }}
        {% if not maxmind_configured %}
          · <span class="pill warn">MaxMind غير مُهيّأ</span>
        {% endif %}
        {% if vpn_provider == "—" %}
          · <span class="pill warn">كاشف VPN غير مُهيّأ</span>
        {% endif %}
      </div>
    </div>
  </nav>

  <main class="wrap">
    {% block body %}{% endblock %}
  </main>
</body>
</html>
